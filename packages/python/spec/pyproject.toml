[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agent-topology-spec"
version = "0.1.0b1"
description = "Python utilities for the agent-topology document contract"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["jsonschema==4.26.0"]

[project.urls]
Documentation = "https://github.com/agent-topology/agent-topology/blob/main/docs/README.md"
Repository = "https://github.com/agent-topology/agent-topology"
Issues = "https://github.com/agent-topology/agent-topology/issues"

[dependency-groups]
test = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_topology"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_topology", "tests", "hatch_build.py", "pyproject.toml", "README.md", "LICENSE"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
