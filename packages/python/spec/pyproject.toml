[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agent-topology-spec"
version = "0.0.0"
description = "Python utilities for the agent-topology document contract"
requires-python = ">=3.11,<3.15"
license = "MIT"

[dependency-groups]
test = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_topology"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_topology", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
