[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agent-topology-langgraph"
version = "0.0.0"
description = "LangGraph producer for agent-topology documents"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["agent-topology-spec>=0.0.0,<0.1.0", "langgraph>=1.2.10,<=1.2.11"]

[project.scripts]
agt = "agent_topology.langgraph._cli:main"

[dependency-groups]
test = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_topology"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_topology", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
agent-topology-spec = { path = "../spec" }
