name: LangGraph release candidates

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.14"
      - name: Detect unqualified stable LangGraph 1.3.x/1.4.x PyPI releases
        run: python3 -m scripts.check_langgraph_release_candidates
