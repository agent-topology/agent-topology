name: LangGraph compatibility

on:
  pull_request:
  push:
    branches: [main, "rc/**"]

permissions:
  contents: read

jobs:
  compatibility-contract:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: contract
        env:
          CONTRACT_FILE: packages/python/langgraph/src/agent_topology/langgraph/_compatibility.json
        run: |
          echo "matrix=$(jq -c '{langgraph: .testedVersions}' "$CONTRACT_FILE")" >> "$GITHUB_OUTPUT"

  conformance:
    needs: compatibility-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-contract.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.1"
      - name: Run producer conformance at LangGraph ${{ matrix.langgraph }}
        run: >-
          uv run --project packages/python/langgraph --group test
          --with "langgraph==${{ matrix.langgraph }}"
          pytest packages/python/langgraph/tests

  typescript-compatibility-contract:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - id: contract
        run: node packages/typescript/langgraph/scripts/check-compatibility.mjs --matrix >> "$GITHUB_OUTPUT"

  typescript-conformance:
    needs: typescript-compatibility-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.typescript-compatibility-contract.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/typescript/spec/package-lock.json
            packages/typescript/langgraph/package-lock.json
      - run: npm ci --prefix packages/typescript/spec
      - name: Build the local specification dependency
        run: npm --prefix packages/typescript/spec run build
      - run: npm ci --prefix packages/typescript/langgraph
      - name: Install declared LangGraph.js version ${{ matrix.langgraph }}
        run: >-
          npm install --prefix packages/typescript/langgraph --no-save --package-lock=false
          "@langchain/langgraph@${{ matrix.langgraph }}"
      - name: Run shared conformance and producer probes
        run: npm --prefix packages/typescript/langgraph run check
