schemaVersion: 1
updatedAt: 2026-09-10

frameworks:
  langgraph:
    implementations:
      python:
        ecosystem: pypi
        distribution: langgraph
        projectRole: first-producer-framework

        baseline:
          version: 1.2.11
          requirement: "langgraph==1.2.11"
          status: verified
          rationale: >-
            Keep 1.2.11 as the research baseline while qualifying the adjacent
            1.2.10 boundary through the same producer tests and shared fixtures.
            ADR 0003 requires every accepted version to have executable evidence.

        support:
          testedRequirement: "langgraph>=1.2.10,<=1.2.11"
          policy: >-
            Expand only when the candidate version passes the producer's
            complete tests and shared conformance matrix. Upstream semantic-versioning
            compatibility does not by itself cover producer access to
            framework internals.

        releases:
          "1.2.10":
            status: verified
            tag: 1.2.10
            commit: 41341457342327166d72fc11952ab28fb61ec0bf
            releasedAt: 2026-07-28
            releaseUrl: https://github.com/langchain-ai/langgraph/releases/tag/1.2.10
            packageUrl: https://pypi.org/project/langgraph/1.2.10/
            sourceRoot: >-
              https://github.com/langchain-ai/langgraph/tree/41341457342327166d72fc11952ab28fb61ec0bf/libs/langgraph/langgraph
            probe: packages/python/langgraph/tests/test_package.py
            conformance: packages/python/langgraph/tests/test_conformance.py

          "1.2.11":
            status: verified
            tag: 1.2.11
            commit: 644815f9e5bc52ad8f7a5227a456227e9c3e639b
            releasedAt: 2026-08-11
            releaseUrl: https://github.com/langchain-ai/langgraph/releases/tag/1.2.11
            packageUrl: https://pypi.org/project/langgraph/1.2.11/
            dossier: frameworks/langgraph/python/1.2.11/dossier.md
            probe: packages/python/langgraph/tests/test_package.py
            conformance: packages/python/langgraph/tests/test_conformance.py

            documentation:
              discoveryIndex:
                url: https://docs.langchain.com/llms.txt
                edition: rolling
                status: documented
              langgraphGuideIndex:
                url: https://docs.langchain.com/oss/python/langgraph/llms.txt
                edition: rolling
                status: documented
              apiReference:
                url: https://reference.langchain.com/python/langgraph/overview
                reportedVersion: 1.2.11
                edition: rolling
                status: documented
              versioning:
                url: https://docs.langchain.com/oss/python/versioning
                edition: rolling
                status: documented
              releasePolicy:
                url: https://docs.langchain.com/oss/python/release-policy
                edition: rolling
                status: documented

            sourceRoot: >-
              https://github.com/langchain-ai/langgraph/tree/644815f9e5bc52ad8f7a5227a456227e9c3e639b/libs/langgraph/langgraph

            topologySurfaces:
              compiledBuilder:
                status: verified
                symbol: langgraph.graph.state.CompiledStateGraph.builder
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraph/blob/644815f9e5bc52ad8f7a5227a456227e9c3e639b/libs/langgraph/langgraph/graph/state.py#L1245-L1316
                finding: >-
                  StateGraph.compile passes builder=self, and
                  CompiledStateGraph stores that builder. The supported producer
                  range is bounded by the compatibility manifest and matrix.
                probe: packages/python/langgraph/tests/test_package.py
                fixture: linear-flow

              nodesAndOrdinaryEdges:
                status: verified
                symbol: langgraph.graph.state.StateGraph
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraph/blob/644815f9e5bc52ad8f7a5227a456227e9c3e639b/libs/langgraph/langgraph/graph/state.py#L188-L195
                finding: >-
                  The builder keeps nodes in nodes and ordinary directed edges
                  in edges.
                probe: packages/python/langgraph/tests/test_package.py
                fixture: linear-flow

              multiSourceEdges:
                status: verified
                symbol: langgraph.graph.state.StateGraph.waiting_edges
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraph/blob/644815f9e5bc52ad8f7a5227a456227e9c3e639b/libs/langgraph/langgraph/graph/state.py#L860-L906
                finding: >-
                  add_edge with multiple sources stores one tuple of sources
                  and one target in waiting_edges, separately from ordinary
                  edges.
                probe: packages/python/langgraph/tests/test_package.py
                fixture: multi-source-join

              conditionalEdges:
                status: verified
                symbol: langgraph.graph.state.StateGraph.add_conditional_edges
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraph/blob/644815f9e5bc52ad8f7a5227a456227e9c3e639b/libs/langgraph/langgraph/graph/state.py#L908-L950
                finding: >-
                  Conditional routes are stored under branches. Without a path
                  map or return type hint, drawable output may assume every
                  node is reachable; the producer must not present that
                  assumption as known routing.
                probe: packages/python/langgraph/tests/test_package.py
                fixture: conditional-routing, unknown-routing-targets, loop

              drawableGraph:
                status: verified
                symbol: langgraph.pregel.main.Pregel.get_graph
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraph/blob/644815f9e5bc52ad8f7a5227a456227e9c3e639b/libs/langgraph/langgraph/pregel/main.py#L792-L817
                finding: >-
                  get_graph is a public method returning a drawable graph. The
                  producer tests compare it with builder state where drawing
                  can flatten joins or invent unknown routing targets.
                probe: packages/python/langgraph/tests/test_package.py
                fixture: nested-subgraph, multi-source-join, unknown-routing-targets

              subgraphs:
                status: verified
                symbol: langgraph.pregel.main.Pregel.get_subgraphs
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraph/blob/644815f9e5bc52ad8f7a5227a456227e9c3e639b/libs/langgraph/langgraph/pregel/main.py#L1005-L1039
                finding: >-
                  get_subgraphs publicly yields immediate subgraphs and
                  optionally recurses through nested Pregel graphs.
                probe: packages/python/langgraph/tests/test_package.py
                fixture: nested-subgraph

              interrupts:
                status: verified
                symbol: langgraph.graph.state.StateGraph.compile
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraph/blob/644815f9e5bc52ad8f7a5227a456227e9c3e639b/libs/langgraph/langgraph/graph/state.py#L1087-L1124
                finding: >-
                  compile accepts interrupt_before and interrupt_after
                  declarations, which remain observable on the compiled graph.
                probe: packages/python/langgraph/tests/test_package.py
                fixture: interrupt-before

      typescript:
        ecosystem: npm
        distribution: "@langchain/langgraph"
        projectRole: second-language-producer-framework
        baseline:
          version: 1.4.14
          requirement: "@langchain/langgraph@1.4.14"
          status: verified
          rationale: >-
            Use one exact release backed by TypeScript-specific source and
            behavioural evidence. Python findings are not treated as evidence
            for this implementation, and ADR 0003 requires untested releases
            to be refused.
        support:
          testedRequirement: "@langchain/langgraph@1.4.14"
          policy: >-
            Derive the package range and CI matrix from the producer's explicit
            tested-version manifest. Add a release only after its source
            surfaces, minimum probes, and all shared fixtures pass.
        releases:
          "1.4.14":
            status: verified
            tag: "@langchain/langgraph@1.4.14"
            commit: 9ae75600dd84d6b2bc736e33baaf66a556d61c49
            releasedAt: 2026-09-04
            releaseUrl: >-
              https://github.com/langchain-ai/langgraphjs/releases/tag/%40langchain/langgraph%401.4.14
            packageUrl: https://www.npmjs.com/package/@langchain/langgraph/v/1.4.14
            dossier: frameworks/langgraph/typescript/1.4.14/dossier.md
            probe: >-
              frameworks/langgraph/typescript/1.4.14/probes/introspection.mjs
            sourceRoot: >-
              https://github.com/langchain-ai/langgraphjs/tree/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src

            topologySurfaces:
              compiledBuilder:
                status: verified
                symbol: CompiledStateGraph.builder
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/graph/state.ts#L1529-L1545
                declarationSourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/graph/state.ts#L1689-L1714
                finding: >-
                  StateGraph.compile passes builder: this and the exported
                  CompiledStateGraph declares the corresponding builder field.
                fixture: linear-flow

              nodesAndOrdinaryEdges:
                status: verified
                symbol: Graph.nodes and Graph.edges
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/graph/graph.ts#L280-L290
                finding: >-
                  The builder keeps node specifications in nodes and ordinary
                  directed pairs in edges.
                fixture: linear-flow

              multiSourceEdges:
                status: verified
                symbol: StateGraph.waitingEdges
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/graph/state.ts#L1241-L1272
                finding: >-
                  addEdge with an array of sources stores one sources-target
                  pair in waitingEdges, separately from ordinary edges.
                fixture: multi-source-join

              conditionalEdges:
                status: verified
                symbol: Graph.addConditionalEdges and Branch.ends
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/graph/graph.ts#L128-L157
                registrationSourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/graph/graph.ts#L435-L496
                finding: >-
                  addConditionalEdges stores a Branch whose ends mapping is
                  present only when destinations were declared. An absent
                  mapping is therefore preserved as an unknown-routing gap.
                fixture: conditional-routing, unknown-routing-targets, loop

              commandDestinations:
                status: verified
                symbol: StateGraphNodeSpec.ends
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/graph/state.ts#L1219-L1235
                finding: >-
                  Node destination declarations are retained on the builder
                  node specification as ends.
                fixture: conditional-routing

              drawableGraph:
                status: verified
                symbol: Pregel.getGraphAsync
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/pregel/index.ts#L769-L778
                finding: >-
                  getGraphAsync is the preferred asynchronous drawable-graph
                  accessor and accepts xray traversal configuration.
                fixture: nested-subgraph

              subgraphs:
                status: verified
                symbol: StateGraphNodeSpec.subgraphs
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/graph/state.ts#L1219-L1230
                finding: >-
                  A Pregel-like node action is retained in the node
                  specification's subgraphs collection.
                fixture: nested-subgraph

              interrupts:
                status: verified
                symbol: Pregel.interruptBefore and Pregel.interruptAfter
                sourceUrl: >-
                  https://github.com/langchain-ai/langgraphjs/blob/9ae75600dd84d6b2bc736e33baaf66a556d61c49/libs/langgraph-core/src/pregel/index.ts#L526-L536
                finding: >-
                  Static before and after interrupt declarations are retained
                  on the compiled Pregel graph.
                fixture: interrupt-before

  langchain:
    implementations:
      python:
        ecosystem: pypi
        distribution: langchain
        projectRole: research-and-integration-only
        baseline:
          version: pending
          requirement: pending
          status: pending
          rationale: >-
            The Python LangGraph producer consumes a compiled LangGraph object.
            Do not add LangChain as a producer runtime dependency unless a
            verified extraction requirement demonstrates that it is necessary.
        releases: {}

      typescript:
        ecosystem: npm
        distribution: langchain
        projectRole: research-and-integration-only
        baseline:
          version: pending
          requirement: pending
          status: pending
          rationale: >-
            Keep future LangChain.js integration research separate from the
            LangGraph.js producer and from Python package findings.
        releases: {}
